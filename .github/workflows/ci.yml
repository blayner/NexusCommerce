name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # also runs `prisma generate`
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - name: Upload coverage
        if: matrix.node == 26
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E (PostgreSQL 18 + Redis 8)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.3
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_commerce_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-jwt-secret-with-enough-length-1234
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: nexus-commerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
