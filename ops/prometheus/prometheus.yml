# Prometheus scrape config for the local docker-compose stack
# (`docker compose --profile observability up`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexus-commerce
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
        labels:
          service: nexus-commerce
